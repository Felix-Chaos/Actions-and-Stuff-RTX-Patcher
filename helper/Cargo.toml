[package]
name = "asrtx-helper"
version = "0.2.0"
edition = "2021"
description = "Small local helper for the A&S RTX Web Patcher: patches the user's own Marketplace copy and installs it straight into Minecraft"
license = "MIT"
publish = false

# Not part of the Tauri app: built and shipped on its own (rtx.chaosdev.dev/webpatcher/asrtx-helper.exe).
[workspace]

[dependencies]
tiny_http = "0.12"
ureq = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
crc32fast = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
