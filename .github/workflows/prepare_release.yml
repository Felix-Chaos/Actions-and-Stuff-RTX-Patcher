name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "What does this release include?"
        required: true
        default: "New Patch"
        type: choice
        options:
          - "New Patch"
          - "Patcher update"
          - "Both"
      pack_version:
        description: "A&S Pack Version (e.g. 1.10.1)"
        required: true
        default: "1.10.1"
        type: string
      patch_version:
        description: "Patch Version (e.g. v1.0)"
        required: true
        default: "v1.0"
        type: string
      prerelease:
        description: "Release type"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - beta
          - alpha

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Read version from package.json
        id: get_version
        run: |
          VERSION=$(jq -r '.version' package.json)
          BUILD_DATE=$(date +'%Y-%m-%d')

          IS_BETA="${{ github.event.inputs.prerelease }}"
          REL_TYPE="${{ github.event.inputs.release_type }}"
          PACK_VER="${{ github.event.inputs.pack_version }}"
          PATCH_VER="${{ github.event.inputs.patch_version }}"

          if [ "$REL_TYPE" = "Both" ]; then
            DISPLAY_TYPE="Patcher and Patch Update"
          else
            DISPLAY_TYPE="$REL_TYPE"
          fi

          if [ "$IS_BETA" = "alpha" ]; then
            TAG="V${VERSION}a"
            TITLE="V${VERSION}a Release of: ${DISPLAY_TYPE} | A&S for RTX ${PACK_VER} | Patch ${PATCH_VER}"
            BADGE="🧪 **Alpha Release** | early testing build, Part of this Programm will not work, use with caution! Report issues on Discord!"
          elif [ "$IS_BETA" = "beta" ]; then
            TAG="V${VERSION}b"
            TITLE="V${VERSION}b Release of: ${DISPLAY_TYPE} | A&S for RTX ${PACK_VER} | Patch ${PATCH_VER}"
            BADGE="🚧 **Beta Release** | may contain bugs, use with caution! Report issues on Discord!"
          else
            TAG="V${VERSION}"
            TITLE="V${VERSION} Release of: ${DISPLAY_TYPE} | A&S for RTX ${PACK_VER} | Patch ${PATCH_VER}"
            BADGE="✅ **Stable Release**"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "badge=$BADGE" >> $GITHUB_OUTPUT

      - name: Generate release body
        id: body
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          BUILD_DATE="${{ steps.get_version.outputs.build_date }}"
          TAG="${{ steps.get_version.outputs.tag }}"
          BADGE="${{ steps.get_version.outputs.badge }}"

          cat > release_body.md << EOF
          ## A&S Minecraft RTX Patcher — ${TAG}

          ${BADGE}

          > Built on: \`${BUILD_DATE}\`

          ---

          ### ✨ What's New
          - 

          ### 🐛 Bug Fixes
          - 

          ### 👥 Contributors
          @Javier6003 (error90099900)
          @Felix-Chaos (FelixChaos)

          > [!NOTE]
          > The patcher does **not** include any original A&S assets, you need your own copy of Actions & Stuff.

          EOF

      - name: Create Draft Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('release_body.md', 'utf8');
            const isPre = '${{ github.event.inputs.prerelease }}' === 'beta' || '${{ github.event.inputs.prerelease }}' === 'alpha';
            const tag = '${{ steps.get_version.outputs.tag }}';
            const title = '${{ steps.get_version.outputs.title }}';

            const result = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: title,
              body: body,
              draft: true,
              prerelease: isPre,
            });

            console.log(`✅ Draft release created: ${result.data.html_url}`);
            console.log(`📌 Version: ${tag}`);
            console.log('Next steps:');
            console.log('  1. Fill in the changelog in the draft');
            console.log('  2. Upload portable.zip as an asset');
            console.log('  3. Publish the release → VirusTotal scan fires automatically');
