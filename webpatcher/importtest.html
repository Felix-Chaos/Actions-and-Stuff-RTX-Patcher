<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>ASRTX Import-Test</title>
<style>
:root{--bg:#0b0f0c;--fg:#eee;--acc:#22c55e}
body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui;display:grid;place-items:center;min-height:100vh;padding:16px;box-sizing:border-box}
.box{width:520px;max-width:100%;border:3px solid var(--acc);border-radius:14px;padding:22px}
h1{font-size:22px;margin:0 0 6px}button{display:block;width:100%;margin:10px 0;padding:12px;font-size:16px;cursor:pointer}
pre{white-space:pre-wrap;font-size:13px;background:#000;padding:8px;border-radius:6px;max-height:220px;overflow:auto}
</style>
</head>
<body>
<div class="box">
<h1>ASRTX Import-Test</h1>
<div>Bei Schritt 1 den Ordner <b>C:\Users\Public\Documents</b> wählen<br><small>(Explorer: Dieser PC → C: → Benutzer → Öffentlich → Öffentliche Dokumente)</small></div>
<button id="t1">1. Ordner wählen &amp; .mcpack schreiben</button>
<button id="t2">2. In Minecraft importieren</button>
<button id="t3">3. .mcpack löschen</button>
<pre id="tlog">Protokoll…
</pre>
</div>
<script>
const B64="UEsDBBQAAAAIAHyscV3AolNu9AAAAE0BAAANAAAAbWFuaWZlc3QuanNvbm2PQWrDMBBF9znFoLVEZFm2FUMoLWRdsA0tBBNkWWpFK9nIcqGEnKf36MmK0kWz6Pb/P8N75w0AMlNwMp4+dFjs5FENDKf4VctRB1TDGZCXTqMa0PfXcN823TM8NI9P7aGB7tB2CAMa9aKCnePvA9TpJdbgrNcqSBPr7fbOunkKcZbqbZ8O1tWOaUkrxUojJVGS7QjnfCSCs4rwsipyOXBDhyLt/+iOGaaY9hiQs/6k/Yv1+gb+mGGWYdrD5WrhpnF910sqkkj8nK8iQS/TGpRebllMwQQvKkE4zQ3h2SDIrhSGyJzlQ1ZQoXj+LwtcoN9cfgBQSwECFAAUAAAACAB8rHFdwKJTbvQAAABNAQAADQAAAAAAAAAAAAAAAAAAAAAAbWFuaWZlc3QuanNvblBLBQYAAAAAAQABADsAAAAfAQAAAAA=";
const NAME="asrtx-browser-test.mcpack", PATH="C:\Users\Public\Documents\\"+NAME;
const logEl=document.getElementById("tlog"); const log=s=>{logEl.textContent+=s+"\n";};
let dir=null;
document.getElementById("t1").onclick=async()=>{try{
  dir=await showDirectoryPicker({id:"asrtx-import",mode:"readwrite",startIn:"documents"});
  log("Ordner: "+dir.name);
  const bytes=Uint8Array.from(atob(B64),c=>c.charCodeAt(0));
  const fh=await dir.getFileHandle(NAME,{create:true}); const w=await fh.createWritable(); await w.write(bytes); await w.close();
  log("geschrieben: "+NAME+" ("+bytes.length+" B)");
}catch(e){log("FEHLER 1: "+e.name+": "+e.message);}};
document.getElementById("t2").onclick=()=>{log("öffne minecraft://?importpack="+PATH); location.href="minecraft://?importpack="+PATH;};
document.getElementById("t3").onclick=async()=>{try{await dir.removeEntry(NAME);log("gelöscht");}catch(e){log("FEHLER 3: "+e.name+": "+e.message);}};
</script>
</body>
</html>
